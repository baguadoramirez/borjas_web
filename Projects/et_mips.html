<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Experimento: Gabor (0.7/3/6°) · RW · Alterna 2s L/R · Calibración</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin:0; padding:0; height:100%; background:#000; color:#eee;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;}

    #ui {
      position: fixed; top:10px; left:10px; right:10px;
      background:#111a; border:1px solid #333; border-radius:8px;
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      padding:8px 12px; z-index: 30; backdrop-filter: blur(6px);
    }
    #ui input[type="text"], #ui input[type="number"], #ui select{
      background:#0f0f0f; color:#eee; border:1px solid #333; border-radius:6px; padding:6px 8px;
    }
    button {
      background:#2b2b2b; color:#eee; border:1px solid #333; border-radius:6px; padding:8px 12px; cursor:pointer;
    }
    button:disabled { opacity:.6; cursor:not-allowed; }
    #status { margin-left:auto; font-size:12px; opacity:.85 }

    #stageWrap { position:fixed; inset:0; display:grid; place-items:center; z-index: 0; }
    #stage { position:relative; width:100vw; height:100vh; overflow:hidden; background:#000; }
    canvas { position:absolute; inset:0; width:100%; height:100%; }
    #noise { z-index: 0; }
    #targetCanvas { z-index: 1; } /* fondo transparente */

    .dot {
      position:absolute; width:12px; height:12px; border-radius:50%;
      transform: translate(-50%,-50%); pointer-events:none; z-index:4; display:none;
    }
    #gazeDot { background: rgba(80,180,255,.9); box-shadow: 0 0 10px rgba(80,180,255,.95); }
    #mouseDot { background: #e74c3c; box-shadow: 0 0 8px #e74c3c; }

    #trialBadge { position:absolute; right:10px; top:10px; z-index:5; background:#000a; border:1px solid #333; border-radius:8px; padding:4px 8px; font-size:12px; }

    #calibOverlay {
      position:absolute; inset:0; z-index: 20; background: rgba(0,0,0,0.65);
      display:none; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:16px;
    }
    #calibUI {
      position:absolute; top:16px; left:16px; right:16px; display:flex; gap:10px; align-items:center; justify-content:space-between;
      background:#000a; border:1px solid #333; border-radius:8px; padding:6px 10px; font-size:14px;
    }
    #calibPoint {
      position:absolute; width:20px; height:20px; border-radius:50%;
      background:#e74c3c; border:2px solid #fff; transform:translate(-50%,-50%); cursor:pointer;
      box-shadow: 0 0 10px #e74c3c;
    }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }

    #centerStart {
      position:absolute; inset:0; display:none; z-index:25; align-items:center; justify-content:center;
      background: rgba(0,0,0,0.5);
    }
    #centerStart .inner {
      position: relative; display:flex; flex-direction:column; align-items:center; gap:8px;
      background:#000a; border:1px solid #333; border-radius:10px; padding:16px 20px; text-align:center;
    }
    #centerDot {
      width:24px; height:24px; border-radius:50%; background:#e74c3c; border:2px solid #fff; cursor:pointer;
      box-shadow: 0 0 10px #e74c3c;
    }

    #webgazerVideoFeed, #webgazerFaceOverlay, #webgazerFaceFeedbackBox, #webgazerVideoContainer {
      display: none !important; opacity: 0 !important; pointer-events: none !important;
    }
  </style>
</head>
<body>
  <div id="ui">
    <label>Participante:
      <input id="pid" type="text" placeholder="p001" style="width:100px">
    </label>

    <!-- Datos físicos -->
    <label>Distancia (cm):
      <input id="viewDistCm" type="number" value="57" step="0.1" style="width:80px" title="Distancia ojo-pantalla">
    </label>
    <label>Ancho pantalla (cm):
      <input id="screenWidthCm" type="number" value="59.6736" step="0.0001" style="width:100px" title="596.736 mm">
    </label>
    <label>Resolución horizontal (px):
      <input id="screenResX" type="number" value="1920" style="width:90px" title="Resolución horizontal de la pantalla">
    </label>

    <!-- Parámetros fijos -->
    <label>SF (c/deg):
      <input id="sfCpd" type="number" value="1" step="0.1" style="width:60px">
    </label>
    <label>Velocidad (deg/s):
      <input id="speedDegSec" type="number" value="2" step="0.1" style="width:60px">
    </label>
    <span>Duración trial: <strong>20 s</strong></span>
    <span>Condiciones: 0.7°, 3°, 6° (10× c/u)</span>

    <button id="btnInit">Inicializar</button>
    <button id="btnCalib" disabled>Calibrar 3×3×2</button>
    <button id="btnStart" disabled>Comenzar</button>
    <button id="btnStop" disabled>Detener</button>
    <button id="btnToggleGaze" disabled title="Desactivado">Ocultar punto de mirada</button>
    <div id="status">Listo. Inicializa WebGazer para comenzar.</div>
  </div>

  <div id="stageWrap">
    <div id="stage" aria-label="escenario">
      <div id="trialBadge">trial —</div>
      <canvas id="noise"></canvas>
      <canvas id="targetCanvas"></canvas>
      <div id="gazeDot" class="dot" aria-hidden="true"></div>
      <div id="mouseDot" class="dot" aria-hidden="true"></div>

      <!-- Calibración -->
      <div id="calibOverlay">
        <div id="calibUI">
          <div>
            <span id="calibTitle"><strong>Calibración</strong></span> —
            <span id="calibProg" class="mono">0</span>/<span id="calibTotal" class="mono">18</span> toques
            &nbsp;|&nbsp; Punto <span id="calibPointIdx" class="mono">1</span>/<span id="calibPointsTotal" class="mono">9</span>
            &nbsp;(<span id="calibClicksLeft" class="mono">2</span> clics restantes)
          </div>
          <button id="calibCancel">Cancelar</button>
        </div>
        <div id="calibPoint" title="Haz clic mirando el punto"></div>
        <div id="calibInstr" style="position:absolute; bottom:16px; left:16px; right:16px; background:#000a; border:1px solid #333; border-radius:8px; padding:8px;">
          <strong>Instrucciones:</strong> Mira el punto rojo y haz clic sobre él.
        </div>
      </div>

      <!-- Clic central para iniciar -->
      <div id="centerStart">
        <div class="inner">
          <div>Para iniciar el trial, haz clic exactamente en el punto central.</div>
          <div id="centerDot" title="Clic para comenzar"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="./lib/webgazer.js"></script>

  <script>
  // ---------- Utilidades ----------
  function randn(){ let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const now = () => performance.now();

  // ---------- UI refs ----------
  const ui = {
    pid: document.getElementById('pid'),
    btnInit: document.getElementById('btnInit'),
    btnCalib: document.getElementById('btnCalib'),
    btnStart: document.getElementById('btnStart'),
    btnStop: document.getElementById('btnStop'),
    btnToggleGaze: document.getElementById('btnToggleGaze'),
    status: document.getElementById('status'),
    viewDistCm: document.getElementById('viewDistCm'),
    screenWidthCm: document.getElementById('screenWidthCm'),
    screenResX: document.getElementById('screenResX'),
    sfCpd: document.getElementById('sfCpd'),
    speedDegSec: document.getElementById('speedDegSec'),
  };

  const stage = document.getElementById('stage');
  const noiseCanvas = document.getElementById('noise');
  const targetCanvas = document.getElementById('targetCanvas');
  const nctx = noiseCanvas.getContext('2d');
  const tctx = targetCanvas.getContext('2d');

  const trialBadge = document.getElementById('trialBadge');
  const gazeDot = document.getElementById('gazeDot');
  const mouseDot = document.getElementById('mouseDot');

  // Calibración UI
  const calibOverlay = document.getElementById('calibOverlay');
  const calibPointEl = document.getElementById('calibPoint');
  const calibProgEl = document.getElementById('calibProg');
  const calibTotalEl = document.getElementById('calibTotal');
  const calibPointIdxEl = document.getElementById('calibPointIdx');
  const calibPointsTotalEl = document.getElementById('calibPointsTotal');
  const calibClicksLeftEl = document.getElementById('calibClicksLeft');
  const calibTitleEl = document.getElementById('calibTitle');
  const calibInstrEl = document.getElementById('calibInstr');
  const calibCancelBtn = document.getElementById('calibCancel');

  const centerStart = document.getElementById('centerStart');
  const centerDot = document.getElementById('centerDot');

  // ---------- Stage rect ----------
  let stageRect = null;
  function refreshStageRect(){ stageRect = stage.getBoundingClientRect(); }

  // ---------- Fondo (ruido leve) ----------
  let noiseFrames = [], lastNoiseIdx = -1, noiseActive = false, noiseFrameCounter = 0;
  const NOISE_COUNT = 8, NOISE_FRAME_PERIOD = 1;
  function makeNoiseImageData(w, h){
    const img = nctx.createImageData(w, h); const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = 118 + (Math.random()*18)|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
    } return img;
  }
  async function buildNoiseFrames(){
    const w = noiseCanvas.width = stage.clientWidth;
    const h = noiseCanvas.height = stage.clientHeight;
    targetCanvas.width = w; targetCanvas.height = h;
    noiseFrames = [];
    for (let i=0;i<NOISE_COUNT;i++){
      const imgData = makeNoiseImageData(w, h);
      if ('createImageBitmap' in window) noiseFrames.push(await createImageBitmap(imgData));
      else noiseFrames.push(imgData);
    }
    lastNoiseIdx = -1;
  }
  function drawNoiseFrame(idx){
    if (!noiseFrames.length) return;
    if ('createImageBitmap' in window) { nctx.clearRect(0,0,noiseCanvas.width, noiseCanvas.height); nctx.drawImage(noiseFrames[idx], 0, 0); }
    else { nctx.putImageData(noiseFrames[idx], 0, 0); }
  }

  // ---------- Grados ↔ px ----------
  function pxPerCm(){ return Number(ui.screenResX.value) / Number(ui.screenWidthCm.value); }
  function degToPixelsTotal(deg){
    const D = Number(ui.viewDistCm.value);
    const cm = 2 * D * Math.tan((deg * Math.PI/180)/2);
    return cm * pxPerCm();
  }

  // ---------- Síntesis de Gabor (transparente) ----------
  const GABOR_BUF_SIZE = 512;
  const gaborCanvas = document.createElement('canvas');
  gaborCanvas.width = gaborCanvas.height = GABOR_BUF_SIZE;
  const gctx = gaborCanvas.getContext('2d');
  let lastRenderedPhase = 0;

      // Contador de subtrials (no se reinicia entre trials)
      let subtrialCounter = 0;
      
  function renderGaborFrame(elapsedSec, params){
    const { sf_cpd, speed_deg_s, sigma_deg, contrast, stim_deg, dir0, tAltern } = params;

    // Dirección alternante cada 2 s: +1, -1, +1, ...
    const block = Math.floor(elapsedSec / tAltern);         // bloques de 2 s
    const dir = (block % 2 === 0 ? dir0 : -dir0);     // alterna cada bloque
    const phase = 2*Math.PI * sf_cpd * speed_deg_s * elapsedSec * dir;
    lastRenderedPhase = phase;

    const degPerPix = stim_deg / GABOR_BUF_SIZE;
    const cx = GABOR_BUF_SIZE/2, cy = GABOR_BUF_SIZE/2;

    const img = gctx.createImageData(GABOR_BUF_SIZE, GABOR_BUF_SIZE);
    const d = img.data;

    const twoSigma2 = 2 * (sigma_deg*sigma_deg);
    const Lmean = 127.5;

    
    let idx = 0;
    for (let j=0; j<GABOR_BUF_SIZE; j++){
      const y_deg = (j - cy) * degPerPix;
      for (let i=0; i<GABOR_BUF_SIZE; i++){
        const x_deg = (i - cx) * degPerPix;
        const r2 = x_deg*x_deg + y_deg*y_deg;
        const win = Math.exp(-r2 / twoSigma2);           // 0..1
        const carrier = Math.cos(2*Math.PI*sf_cpd*x_deg + phase);
        const L = Lmean * (1 + 0.92 * carrier * win);     // contraste constante 0.92
        const a = Math.max(0, Math.min(1, win));          // alfa = ventana
        d[idx++] = L; d[idx++] = L; d[idx++] = L; d[idx++] = Math.round(a*255);
      }
    }
    gctx.putImageData(img, 0, 0);
  }

  // ---------- Random walk con corrección al centro ----------
  const STEP_PX = 10;
  const LIMIT_PX = 400;
  const CORRECT_FRAMES = 5;
  const CORRECT_STEP = 30;
  let pos = { x: 0, y: 0 };
  let correctFramesLeft = 0;
  function centerPt(){ return { x: targetCanvas.width/2, y: targetCanvas.height/2 }; }
  function stepRandomWalk(){
    const c = centerPt();
    if (correctFramesLeft > 0){
      const dx = c.x - pos.x, dy = c.y - pos.y;
      const L = Math.hypot(dx, dy) || 1;
      pos.x += (dx / L) * CORRECT_STEP;
      pos.y += (dy / L) * CORRECT_STEP;
      correctFramesLeft--;
    } else {
      pos.x += randn() * STEP_PX;
      pos.y += randn() * STEP_PX;
    }
    pos.x = clamp(pos.x, c.x - LIMIT_PX, c.x + LIMIT_PX);
    pos.y = clamp(pos.y, c.y - LIMIT_PX, c.y + LIMIT_PX);
    if (Math.abs(pos.x - c.x) >= LIMIT_PX || Math.abs(pos.y - c.y) >= LIMIT_PX){
      correctFramesLeft = CORRECT_FRAMES;
    }
  }

  // ---------- Dibujo del único target ----------
  function drawGaborToStage(stimDeg){
    const px = degToPixelsTotal(stimDeg);
    const w = targetCanvas.width, h = targetCanvas.height;
    tctx.clearRect(0,0,w,h);                 // asegurar un solo target
    const x = pos.x - px/2;
    const y = pos.y - px/2;
    tctx.drawImage(gaborCanvas, x, y, px, px);
  }

  // ---------- WebGazer ----------
  let lastPred = null; let calibrated = false;
  function setStatus(s){ ui.status.textContent = s; }
  async function initWebGazer(){
    if (!window.webgazer) { alert('No se encontró ./lib/webgazer.js'); return; }
    setStatus('Inicializando WebGazer…');
    if (webgazer.params) webgazer.params.saveDataAcrossSessions = false;
    try { webgazer.clearData && webgazer.clearData(); } catch(e) {}
    webgazer.params.showVideoPreview = false;
    webgazer.params.showFaceOverlay = false;
    webgazer.params.showFaceFeedbackBox = false;
    webgazer.setRegression('ridge');
    webgazer.setTracker('clmtrackr');
    webgazer.setGazeListener((data) => {
      if (data && Number.isFinite(data.x) && Number.isFinite(data.y)) lastPred = data;
    });
    try{
      await webgazer.begin();
      setStatus('WebGazer listo. Calibra 3×3×2 (inicial).');
      ui.btnInit.disabled = true;
      ui.btnCalib.disabled = false;
      ui.btnToggleGaze.disabled = true; // desactivado
    } catch(e){
      console.error(e);
      setStatus('Fallo al iniciar WebGazer.');
    }
  }

  // ---------- Calibración ----------
  function generateCalibrationPoints(cols, rows){
    const marginX = stage.clientWidth * 0.07;
    const marginY = stage.clientHeight * 0.07;
    const usableW = stage.clientWidth - 2*marginX;
    const usableH = stage.clientHeight - 2*marginY;
    const pts = [];
    for (let r=0;r<rows;r++){
      for (let c=0;c<cols;c++){
        const x = marginX + (c + 0.5) * (usableW / cols);
        const y = marginY + (r + 0.5) * (usableH / rows);
        pts.push({x,y});
      }
    }
    for (let i=pts.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [pts[i], pts[j]] = [pts[j], pts[i]];
    }
    return pts;
  }
  function startCalibrationGeneric(cols, rows, clicksPerPoint, title, instruction, onDone){
    refreshStageRect();
    const points = generateCalibrationPoints(cols, rows);
    const totalPoints = points.length;
    const totalClicks = totalPoints * clicksPerPoint;
    let clicksDone = 0;
    let pointIdx = 0;
    let clicksLeftThisPoint = clicksPerPoint;

    calibTitleEl.innerHTML = `<strong>${title}</strong>`;
    calibInstrEl.innerHTML = `<strong>Instrucciones:</strong> ${instruction}`;
    calibTotalEl.textContent = String(totalClicks);
    calibPointsTotalEl.textContent = String(totalPoints);

    function placePoint(){
      const p = points[pointIdx];
      calibPointEl.style.left = p.x + 'px';
      calibPointEl.style.top  = p.y + 'px';
      calibPointIdxEl.textContent = String(pointIdx+1);
      calibClicksLeftEl.textContent = String(clicksLeftThisPoint);
    }

    function endCalibration(success){
      calibOverlay.style.display = 'none';
      calibPointEl.onclick = null;
      onDone && onDone(success);
    }

    calibOverlay.style.display = 'flex';
    calibProgEl.textContent = '0';
    clicksDone = 0; pointIdx = 0; clicksLeftThisPoint = clicksPerPoint;
    placePoint();

    calibPointEl.onclick = () => {
      const p = points[pointIdx];
      const pageX = stageRect.left + p.x;
      const pageY = stageRect.top  + p.y;
      webgazer.recordScreenPosition(pageX, pageY, 'click');

      clicksDone++;
      clicksLeftThisPoint--;
      calibProgEl.textContent = String(clicksDone);
      calibClicksLeftEl.textContent = String(clicksLeftThisPoint);

      calibPointEl.style.transform = 'translate(-50%,-50%) scale(0.9)';
      setTimeout(()=>calibPointEl.style.transform='translate(-50%,-50%)', 80);

      if (clicksLeftThisPoint <= 0){
        pointIdx++;
        if (pointIdx >= totalPoints){ endCalibration(true); return; }
        clicksLeftThisPoint = clicksPerPoint;
        placePoint();
      }
    };

    calibCancelBtn.onclick = () => endCalibration(false);
  }

  // ---------- Ratón (log, cursor SIEMPRE visible) ----------
  let mouse = { x: null, y: null };
  function updateMouseFromEvent(e){
    const rect = stage.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  }
  stage.addEventListener('mousemove', (e) => { updateMouseFromEvent(e); });
  stage.addEventListener('mouseenter', (e) => { updateMouseFromEvent(e); });
  stage.addEventListener('mouseleave', () => { mouse.x = mouse.y = null; });

  // ---------- Plan de trials (10× cada tamaño, aleatorio) ----------
  const SIZE_CONDS = [0.7, 3, 6]; // diámetros (deg)
  function buildTrialSchedule(){
    const arr = [];
    for (let rep=0; rep<10; rep++){
      for (const d of SIZE_CONDS) arr.push(d);
    }
    // barajar
    for (let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  let schedule = [];
  let currentDiameterDeg = null;

  // ---------- Trials ----------
  let trialIdx = 0, totalTrials = 0;
  let trialStart = 0, trialDurationMs = 20000, running = false, rafId = null, trialTimer = null;
  let rowsCSV = [];
  let waitingCenterClick = false;

  function resizeAll(){
    refreshStageRect();
    const w = stage.clientWidth, h = stage.clientHeight;
    noiseCanvas.width = w; noiseCanvas.height = h;
    targetCanvas.width = w; targetCanvas.height = h;
  }

  function showCenterStartOverlay(){ centerStart.style.display = 'flex'; waitingCenterClick = true; }
  function hideCenterStartOverlay(){ centerStart.style.display = 'none'; waitingCenterClick = false; }
  centerDot.addEventListener('click', () => {
    if (!waitingCenterClick) return;
    hideCenterStartOverlay();
    startTrialLoopCore();
    trialTimer = setTimeout(endTrial, trialDurationMs);
  });

  let stimParams = null;

  function startTrialLoopCore(){
    running = true;
    rowsCSV = [];
    trialStart = now();
    trialBadge.textContent = `trial ${trialIdx+1} / ${totalTrials} — diámetro ${currentDiameterDeg}°`;

    // parámetros del trial
    const sf_cpd = Number(ui.sfCpd.value);
    const speed_deg_s = Number(ui.speedDegSec.value);
    const sigma_deg = currentDiameterDeg / 2;            // σ = diámetro/2
    const contrast = 0.92;                               // constante
    const stim_deg = 20.1;
    const dir0 = Math.random() < 0.5 ? -1 : +1;          // dirección inicial (alternará cada 2 s)
    const tAltern = 5;
    stimParams = { sf_cpd, speed_deg_s, sigma_deg, contrast, stim_deg, dir0, tAltern };
    let prevBlock = -1; // para detectar el cambio de bloque de 2 s

    // posición inicial al centro
    pos = { x: targetCanvas.width/2, y: targetCanvas.height/2 };
    correctFramesLeft = 0;

    noiseActive = true; noiseFrameCounter = 0;

    function frame(){
      if (!running) return;

      // Fondo (ruido leve)
      if (noiseActive && noiseFrames.length){
        if (noiseFrameCounter % NOISE_FRAME_PERIOD === 0){
          let idx;
          do { idx = Math.floor(Math.random()*noiseFrames.length); } while (idx === lastNoiseIdx && noiseFrames.length > 1);
          lastNoiseIdx = idx;
          drawNoiseFrame(idx);
        }
        noiseFrameCounter++;
      }

      // Random walk + corrección
      stepRandomWalk();

      // Render/dibujo
      const t = (now() - trialStart)/1000;
      renderGaborFrame(t, stimParams);
      drawGaborToStage(20.1);

      // Mirada cruda
      let gx = '', gy = '';
      if (lastPred && Number.isFinite(lastPred.x) && Number.isFinite(lastPred.y)) {
        gx = Math.round((lastPred.x - stageRect.left)*100)/100;
        gy = Math.round((lastPred.y - stageRect.top)*100)/100;
      }

      // Dirección efectiva (para log): alterna cada 2 s
      // Bloques de 5 s: 0,1,2,...
      const tAltern = 5;
      const block = Math.floor(t / tAltern);

      // Si cambiamos de bloque (=> cambia la dirección), aumenta subtrial (no al primer frame)
      if (prevBlock === -1) {
        prevBlock = block;         // inicializa sin incrementar
      } else if (block !== prevBlock) {
        subtrialCounter++;         // cuenta el cambio de dirección
        prevBlock = block;
      }

      // Dirección efectiva alternante cada 2 s
      const dirEff = (block % tAltern === 0 ? stimParams.dir0 : -stimParams.dir0);

      // Log por frame
      const c = centerPt();
      rowsCSV.push({
        participant_id: ui.pid.value || '',
        trial_number: trialIdx + 1,
        subtrial: block,
        trial_time_ms: Math.round((now() - trialStart)),
        target_x_px: Math.round(pos.x),
        target_y_px: Math.round(pos.y),
        offset_x_from_center_px: Math.round(pos.x - c.x),
        offset_y_from_center_px: Math.round(pos.y - c.y),
        cursor_x_px: mouse.x != null ? Math.round(mouse.x*100)/100 : '',
        cursor_y_px: mouse.y != null ? Math.round(mouse.y*100)/100 : '',
        gaze_x_px: gx,
        gaze_y_px: gy,
        diameter_deg: currentDiameterDeg,
        gabor_sigma_deg: sigma_deg,
        sf_cpd: sf_cpd,
        speed_deg_s_signed: speed_deg_s * dirEff,
        contrast_michelson: contrast,
        frame_phase_rad: Math.round(lastRenderedPhase*1000)/1000
      });

      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
  }

  function stopTrialLoop(){
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    noiseActive = false;
  }

  function toCSV(rows, headers){
    const esc = v => {
      if (v === null || v === undefined) return '';
      const s = String(v);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
    };
    const out = [ headers.join(',') ];
    for (const r of rows) out.push(headers.map(h => esc(r[h])).join(','));
    return out.join('\n');
  }
  function download(filename, content, mime='text/csv'){
    const blob = new Blob([content], {type:mime});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    URL.revokeObjectURL(a.href);
    a.remove();
  }

  function doPostTrialCalibration(next){
    // Recalibración 3×3×1 y después iniciar el siguiente con clic central (startTrial la muestra)
    startCalibrationGeneric(
      3, 3, 1,
      'Calibración post-trial (3×3×1)',
      'Mira el punto y haz un clic en cada posición (9 en total).',
      (ok) => {
        setStatus(ok ? 'Calibración post-trial completada.' : 'Calibración post-trial cancelada. Continuando…');
        next && next(); // -> startTrial() que muestra el overlay de clic central
      }
    );
  }

  function endTrial(){
    stopTrialLoop();
    if (trialTimer) clearTimeout(trialTimer);
    trialTimer = null;

    const headers = [
      'participant_id','trial_number','subtrial', 'trial_time_ms',
      'target_x_px','target_y_px','offset_x_from_center_px','offset_y_from_center_px',
      'cursor_x_px','cursor_y_px','gaze_x_px','gaze_y_px',
      'diameter_deg','gabor_sigma_deg','sf_cpd','speed_deg_s_signed','contrast_michelson','frame_phase_rad'
    ];
    const csv = toCSV(rowsCSV, headers);
    const pid = (ui.pid.value || 'participant').replace(/[^\w-]+/g,'_');
    const fname = `${pid}_trial${(trialIdx+1).toString().padStart(2,'0')}_d${String(currentDiameterDeg).replace('.','p')}deg.csv`;
    download(fname, csv);

    setStatus(`Trial ${trialIdx+1} finalizado. CSV descargado.`);

    trialIdx++;
    if (trialIdx < totalTrials){
      doPostTrialCalibration(() => {
        setTimeout(startTrial, 200); // startTrial muestra clic central
      });
    } else {
      ui.btnStart.disabled = false;
      ui.btnStop.disabled = true;
      setStatus('Sesión completa. ¡Buen trabajo!');
    }
  }

  // ---------- Control de flujo ----------
  function startTrial(){
    // fija condición del trial según schedule
    currentDiameterDeg = schedule[trialIdx];
    const secs = 20; // fijo por requisito
    trialDurationMs = secs * 1000;

    // overlay de clic central antes de cada trial
    showCenterStartOverlay();

    setStatus(`Trial ${trialIdx+1}/${totalTrials} — diámetro ${currentDiameterDeg}°. Clic en el centro para comenzar.`);
    ui.btnStart.disabled = true;
    ui.btnStop.disabled = false;
  }

  // ---------- Botonera ----------
  ui.btnInit.addEventListener('click', async () => {
    // Mostrar predicción de la mirada
    if (window.webgazer?.showPredictionPoints) webgazer.showPredictionPoints(true);
    await initWebGazer();
    resizeAll();
    await buildNoiseFrames();
    drawNoiseFrame(0);
  });

  // Calibración INICIAL 3×3×2 (9 puntos, 2 clics → 18)
  ui.btnCalib.addEventListener('click', () => {
    startCalibrationGeneric(
      5, 5, 2,
      'Calibración inicial (3×3×2)',
      'Mira el punto rojo y haz 2 clics en cada posición.',
      (ok) => {
        if (ok) {
          setStatus('Calibración inicial completada. Puedes comenzar.');
          calibrated = true;
          ui.btnStart.disabled = false;
        } else {
          setStatus('Calibración inicial cancelada.');
        }
      }
    );
  });

  ui.btnStart.addEventListener('click', () => {
    if (!window.webgazer?.isReady?.()) { alert('Primero pulsa “Inicializar”.'); return; }
    if (!calibrated) { alert('Debes completar la calibración inicial.'); return; }
    // construir planificación y arrancar
    schedule = buildTrialSchedule();
    totalTrials = schedule.length; // 30
    trialIdx = 0;
    startTrial();
  });

  ui.btnStop.addEventListener('click', () => {
    if (running || waitingCenterClick) { centerStart.style.display='none'; endTrial(); }
  });

  ui.btnToggleGaze.addEventListener('click', () => { /* desactivado intencionalmente */ });

  window.addEventListener('resize', async () => {
    resizeAll();
    await buildNoiseFrames();
    drawNoiseFrame(0);
  });

  window.addEventListener('load', async () => {
    refreshStageRect();
    resizeAll();
    await buildNoiseFrames();
    drawNoiseFrame(0);
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      console.warn('Usa HTTPS o http://localhost para acceso a cámara.');
      setStatus('Atención: sirve en http://localhost o HTTPS para la cámara.');
    }
  });
  </script>
</body>
</html>
